spring.application.name=SW-GiG-Backend
spring.datasource.url=${GIG_DATABASE_URL:jdbc:h2:file:./data/gig}
spring.datasource.username=${GIG_DATABASE_USER:sa}
spring.datasource.password=${GIG_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${GIG_SCHEMA_MODE:update}
spring.jpa.open-in-view=false
server.error.include-message=never
spring.jackson.deserialization.accept-float-as-int=false
